  <style>
    /* Extra helpers for static version (keeps original look) */
    body {
      background-color: #05060b;
    }

    .login-page-out {
      min-height: 100vh;
    }

    /* Phone code popup */
    .phone-code-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .phone-code-modal.show {
      display: flex;
    }

    .phone-code-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }

    .phone-code-panel {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #020617;
      border-radius: 16px 16px 0 0;
      padding: 12px 12px 16px;
      box-shadow: 0 -12px 30px rgba(15, 23, 42, 0.9);
      z-index: 1;
    }

    .phone-code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 8px;
    }

    .phone-code-title {
      font-size: 14px;
      color: #e5e7eb;
    }

    .phone-code-close {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .phone-code-close-icon {
      position: relative;
      width: 14px;
      height: 14px;
    }

    .phone-code-close-icon::before,
    .phone-code-close-icon::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 100%;
      height: 2px;
      background: #9ca3af;
      transform-origin: center;
    }

    .phone-code-close-icon::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .phone-code-close-icon::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .phone-code-search {
      margin: 0 4px 10px;
    }

    .phone-code-search-input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      padding: 7px 12px;
      background: #020617;
      color: #f9fafb;
      font-size: 13px;
      outline: none;
    }

    .phone-code-search-input::placeholder {
      color: #6b7280;
    }

    .phone-code-list-label {
      font-size: 11px;
      color: #9ca3af;
      margin: 0 4px 4px;
    }

    .phone-code-list {
      max-height: 260px;
      overflow-y: auto;
      padding: 2px 0;
    }

    .phone-code-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .phone-code-item:active {
      background: rgba(15, 23, 42, 0.9);
    }

    .phone-code-item-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-code-flag {
      width: 20px;
      height: 14px;
      border-radius: 3px;
      background: #1f2937;
    }

    .phone-code-name {
      font-size: 13px;
      color: #e5e7eb;
    }

    .phone-code-dial {
      font-size: 13px;
      color: #9ca3af;
    }

    .phone-code-check {
      font-size: 14px;
      color: #22c55e;
    }

    /* Prefix box tweak */
    .prefix_box {
      cursor: pointer;
    }

    .prefix_box span.phone-code-text {
      margin-right: 4px;
    }

    /* Login button enabled/disabled */
    .bt {
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    .bt.login-disabled {
      opacity: 0.35;
      filter: grayscale(0.3);
      pointer-events: none;
    }

    .bt.login-enabled {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }

  <script>
    // Static phone code popup + login button behavior
    (function () {
      var codes = [
        { name: "Slovenia", dial: "+386" },
        { name: "Panama", dial: "+507" },
        { name: "Syria", dial: "+963" },
        { name: "Republic of Lebanon", dial: "+961" },
        { name: "Cyprus", dial: "+357" },
        { name: "Saudi Arabia", dial: "+966" }
      ];

      var modal = document.getElementById("phoneCodeModal");
      var listEl = document.getElementById("phoneCodeList");
      var searchInput = document.getElementById("phoneCodeSearch");
      var closeBtn = document.getElementById("phoneCodeClose");
      var backdrop = document.getElementById("phoneCodeBackdrop");
      var trigger = document.getElementById("phoneCodeTrigger");
      var codeTextEl = trigger ? trigger.querySelector(".phone-code-text") : null;

      function renderList(filter) {
        if (!listEl) return;
        listEl.innerHTML = "";
        var query = (filter || "").toLowerCase();

        codes.forEach(function (item) {
          if (query) {
            var target = (item.name + " " + item.dial).toLowerCase();
            if (target.indexOf(query) === -1) {
              return;
            }
          }

          var row = document.createElement("div");
          row.className = "phone-code-item";

          var main = document.createElement("div");
          main.className = "phone-code-item-main";

          var flag = document.createElement("div");
          flag.className = "phone-code-flag";

          var name = document.createElement("div");
          name.className = "phone-code-name";
          name.textContent = item.name;

          main.appendChild(flag);
          main.appendChild(name);

          var dial = document.createElement("div");
          dial.className = "phone-code-dial";
          dial.textContent = item.dial;

          row.appendChild(main);
          row.appendChild(dial);

          row.addEventListener("click", function () {
            if (codeTextEl) {
              codeTextEl.textContent = item.dial;
            }
            hideModal();
          });

          listEl.appendChild(row);
        });
      }

      function showModal() {
        if (!modal) return;
        renderList("");
        if (searchInput) {
          searchInput.value = "";
        }
        modal.classList.add("show");
      }

      function hideModal() {
        if (!modal) return;
        modal.classList.remove("show");
      }

      if (trigger) {
        trigger.addEventListener("click", function () {
          showModal();
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener("click", hideModal);
      }
      if (backdrop) {
        backdrop.addEventListener("click", hideModal);
      }
      if (searchInput) {
        searchInput.addEventListener("input", function () {
          renderList(searchInput.value || "");
        });
      }

      // Login validation
      var phoneInput = document.getElementById("loginPhone");
      var passwordInput = document.getElementById("loginPassword");
      var loginButton = document.getElementById("loginButton");

      function updateLoginState() {
        if (!phoneInput || !passwordInput || !loginButton) return;
        var phone = (phoneInput.value || "").trim();
        var pass = passwordInput.value || "";
        var enabled = phone.length > 0 && pass.length >= 8;

        if (enabled) {
          loginButton.classList.remove("login-disabled");
          loginButton.classList.add("login-enabled");
        } else {
          loginButton.classList.add("login-disabled");
          loginButton.classList.remove("login-enabled");
        }
      }

      if (phoneInput) {
        phoneInput.addEventListener("input", updateLoginState);
      }
      if (passwordInput) {
        passwordInput.addEventListener("input", updateLoginState);
      }

      if (loginButton) {
        loginButton.addEventListener("click", function () {
          if (!loginButton.classList.contains("login-enabled")) {
            return;
          }
          // Test behavior: go to Member page after "login"
          window.location.href = "Member.html";
        });
      }

      updateLoginState();
    })();
  </script>

  <script src="./nav-links.js"></script>
</body>
</html>
